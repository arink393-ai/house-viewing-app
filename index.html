<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1F4E5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="看房紀錄">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="租屋看房用的檢查表：20 大類項目、評分比較、紅旗警訊，資料只存在自己的手機裡。">
<title>看房紀錄 App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  --accent:#2E86AB;
  --accent-dark:#1F4E5F;
  --bg:#F4F7F8;
  --card:#FFFFFF;
  --line:#E3E9EB;
  --text:#20303A;
  --sub:#7B8A93;
  --input-fill:#FFF9E0;
  --gold:#C9962C;
  --red:#D8555A;
  --green:#4C9A6B;
  --radius:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  height:100%;overscroll-behavior-y:none;}
body{display:flex;flex-direction:column;height:100dvh;}

header{
  background:linear-gradient(135deg,var(--accent-dark),var(--accent));
  color:#fff;padding:calc(10px + var(--safe-top)) 16px 12px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  position:relative;z-index:5;
}
header h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:6px;}
header .btn-icon{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;
  width:36px;height:36px;font-size:18px;display:flex;align-items:center;justify-content:center;}
header .hdr-right{display:flex;gap:8px;}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(90px + var(--safe-bottom));}

nav.bottomnav{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-bottom);z-index:20;
}
nav.bottomnav button{flex:1;border:none;background:none;padding:10px 4px 8px;display:flex;
  flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:11px;font-family:inherit;}
nav.bottomnav button.active{color:var(--accent);font-weight:700;}
nav.bottomnav .ic{font-size:20px;}

.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:0 6px 16px rgba(46,134,171,.45);
  display:flex;align-items:center;justify-content:center;z-index:15;}

.searchbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.searchbar input{border:none;outline:none;flex:1;font-size:15px;background:transparent;color:var(--text);}

.house-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid var(--accent);position:relative;}
.house-card .tag-line{font-weight:700;font-size:15px;color:var(--accent-dark);margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.house-card .addr{font-size:12.5px;color:var(--sub);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.house-card .meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.pill{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#EEF3F5;color:var(--accent-dark);white-space:nowrap;}
.pill.status{background:#E7F3EC;color:var(--green);}
.pill.flag{background:#FBEAEA;color:var(--red);}
.pill.decision{font-weight:700;}
.empty-state{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;line-height:1.8;}
.empty-state .big{font-size:40px;margin-bottom:8px;}

.score-badge{font-weight:800;border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap;}
.score-badge.good{background:#E7F3EC;color:var(--green);}
.score-badge.mid{background:#FFF3DC;color:#8A6416;}
.score-badge.bad{background:#FBEAEA;color:var(--red);}
.score-badge.none{background:#EEF3F5;color:var(--sub);}
.medal{font-size:15px;}

.edit-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.edit-header button.back{background:none;border:none;font-size:20px;color:var(--accent-dark);padding:4px 8px 4px 0;}
.edit-header .id-input{flex:1;border:none;background:transparent;font-size:17px;font-weight:700;color:var(--accent-dark);outline:none;
  border-bottom:2px solid var(--line);padding:4px 2px;}
.edit-header .del-btn{background:#FBEAEA;color:var(--red);border:none;border-radius:8px;padding:8px 10px;font-size:13px;}

.summary-bar{display:flex;gap:8px;margin-bottom:14px;}
.summary-tile{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.summary-tile .val{font-size:19px;font-weight:800;color:var(--accent-dark);}
.summary-tile .lbl{font-size:11px;color:var(--sub);margin-top:2px;}

details.section{background:#fff;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.05);}
details.section summary{list-style:none;padding:13px 14px;font-weight:700;font-size:14.5px;color:var(--accent-dark);
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
details.section summary::-webkit-details-marker{display:none;}
details.section summary .chev{transition:transform .2s;color:var(--sub);font-size:12px;}
details.section[open] summary .chev{transform:rotate(90deg);}
details.section .section-body{padding:4px 14px 14px;border-top:1px solid var(--line);}

.field{margin-top:14px;}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],
.field input[type=tel],.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:var(--input-fill);border-radius:10px;
  padding:9px 11px;font-size:14.5px;color:var(--text);font-family:inherit;outline:none;}
.field textarea{min-height:54px;resize:vertical;}
.field .unit-wrap{position:relative;}
.field .unit-wrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px;}

.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--text);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.chip.on.multi{background:var(--accent-dark);border-color:var(--accent-dark);}
.chip.dashed{background:none;border:1px dashed #C6CFD3;color:var(--sub);}

.stars{display:flex;gap:4px;}
.stars .star{font-size:26px;color:#DADFE2;line-height:1;}
.stars .star.on{color:var(--gold);}

.checklist-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.checklist-item:last-child{border-bottom:none;}
.checklist-item .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
.checklist-item.on .box{background:var(--accent);border-color:var(--accent);}
.checklist-item.flagitem.on .box{background:var(--red);border-color:var(--red);}

.stepper{display:flex;align-items:center;gap:12px;}
.stepper button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--accent-dark);font-weight:700;}
.stepper button:active{background:#EEF3F5;}
.stepper .val{min-width:56px;text-align:center;font-weight:800;font-size:15px;color:var(--text);}

.tags-counter{font-size:11px;color:var(--sub);margin-top:6px;}
.tags-custom-wrap{margin-top:9px;display:none;gap:6px;}
.tags-custom-wrap.show{display:flex;}
.tags-custom-wrap input{flex:1;border:1px solid var(--line);background:var(--input-fill);border-radius:10px;padding:8px 10px;font-size:13.5px;font-family:inherit;}
.tags-custom-wrap button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-size:13px;}

.other-wrap{margin-top:9px;display:none;}
.other-wrap.show{display:block;}
.other-wrap input{width:100%;border:1px solid var(--line);background:var(--input-fill);border-radius:10px;padding:8px 10px;font-size:13.5px;font-family:inherit;}

.note-toggle{margin-top:8px;background:none;border:none;padding:0;font-size:12px;color:var(--accent);font-weight:600;}
.note-wrap{margin-top:8px;display:none;}
.note-wrap.show{display:block;}
.note-wrap input{width:100%;border:1px solid var(--line);background:var(--input-fill);border-radius:10px;padding:8px 10px;font-size:13.5px;font-family:inherit;}

.top-badge{margin-top:4px;font-size:11.5px;color:var(--accent);font-weight:700;}

/* ---------- compare view ---------- */
.compare-controls{display:flex;gap:8px;margin-bottom:12px;}
.compare-controls select{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;
  background:#fff;color:var(--text);font-family:inherit;}
.compare-row{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  display:flex;align-items:center;gap:12px;}
.compare-row .rank{font-size:16px;font-weight:800;color:var(--accent);width:26px;text-align:center;flex-shrink:0;}
.compare-row .info{flex:1;min-width:0;}
.compare-row .info .t1{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.compare-row .info .t2{font-size:12px;color:var(--sub);margin-top:2px;}

.top-pick-card{background:linear-gradient(135deg,#FFF7E0,#FFF3DC);border:1px solid #F0DBA0;border-radius:14px;padding:14px;margin-bottom:16px;}
.top-pick-card h3{margin:0 0 10px;font-size:13.5px;color:#8A6416;}
.top-pick-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #EADFB8;}
.top-pick-row:last-child{border-bottom:none;}
.top-pick-row .medal{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
.top-pick-row .info{flex:1;min-width:0;}
.top-pick-row .info .t1{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-pick-row .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;}
.top-pick-row .tags span{font-size:10.5px;background:rgba(138,100,22,.12);color:#8A6416;padding:2px 7px;border-radius:20px;}
.top-pick-row .n{font-weight:800;font-size:16px;color:#8A6416;flex-shrink:0;}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;}
.modal-sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + var(--safe-bottom));
  max-height:80vh;overflow-y:auto;}
.modal-sheet h2{margin:0 0 14px;font-size:17px;color:var(--accent-dark);}
.modal-sheet .menu-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14.5px;}
.modal-sheet .menu-item:last-child{border-bottom:none;}
.modal-sheet .menu-item .ic{font-size:20px;width:26px;text-align:center;}
.modal-sheet .menu-desc{font-size:12px;color:var(--sub);margin-top:2px;}
.modal-close{position:absolute;top:14px;right:14px;background:#F0F3F4;border:none;border-radius:50%;
  width:30px;height:30px;font-size:15px;color:var(--sub);}
.toast{position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:rgba(32,48,58,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:80;
  opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.save-banner{background:#FFF3DC;color:#8A6416;font-size:11.5px;text-align:center;padding:6px;border-radius:8px;margin-bottom:10px;}
.score-explain{font-size:11px;color:var(--sub);text-align:center;margin:-8px 0 14px;}
</style>
</head>
<body>

<header>
  <h1>🏠 看房紀錄</h1>
  <div class="hdr-right">
    <button class="btn-icon" id="btnMenu">⋯</button>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fabAdd" title="新增看房紀錄">＋</button>

<nav class="bottomnav">
  <button data-view="list" class="navbtn"><span class="ic">🏘️</span><span>列表</span></button>
  <button data-view="compare" class="navbtn"><span class="ic">🏆</span><span>排行比較</span></button>
  <button data-view="help" class="navbtn"><span class="ic">❓</span><span>怎麼問</span></button>
</nav>

<input type="file" id="fileImport" accept="application/json" style="display:none">
<div id="toast" class="toast"></div>

<datalist id="mrtStations">
<!-- 常見捷運站，僅供輸入建議，仍可自行輸入任何站名 -->
<option value="台北車站"><option value="中山"><option value="民權西路"><option value="雙連">
<option value="大安"><option value="大安森林公園"><option value="信義安和"><option value="市政府">
<option value="國父紀念館"><option value="忠孝復興"><option value="忠孝敦化"><option value="忠孝新生">
<option value="西門"><option value="龍山寺"><option value="古亭"><option value="公館">
<option value="台電大樓"><option value="景美"><option value="萬隆"><option value="新店">
<option value="永和"><option value="頂溪"><option value="永安市場"><option value="中和">
<option value="景安"><option value="南勢角"><option value="板橋"><option value="府中">
<option value="新埔"><option value="江子翠"><option value="西門町"><option value="東門">
<option value="中正紀念堂"><option value="小南門"><option value="劍潭"><option value="士林">
<option value="芝山"><option value="石牌"><option value="北投"><option value="淡水">
<option value="松江南京"><option value="南京復興"><option value="行天宮"><option value="中山國小">
<option value="圓山"><option value="民生社區"><option value="內湖"><option value="南港">
<option value="南港軟體園區"><option value="昆陽"><option value="後山埤">
</datalist>

<script>
/* =========================================================
   SCHEMA HELPERS
========================================================= */
const T=(key,label,ph,extra)=>({type:'text',key,label,placeholder:ph,...(extra||{})});
const N=(key,label,unit)=>({type:'number',key,label,unit});
const D=(key,label)=>({type:'date',key,label});
const TM=(key,label)=>({type:'time',key,label});
const TEL=(key,label)=>({type:'tel',key,label});
const C=(key,label,opts)=>({type:'choice',key,label,options:opts});
const M=(key,label,opts)=>({type:'multiselect',key,label,options:opts});
const S=(key,label)=>({type:'star',key,label});
const TA=(key,label)=>({type:'textarea',key,label});
const CL=(key,label,items,flag)=>({type:'checklist',key,label,items,flag:!!flag});
const ST=(key,label,min,max,step,unit)=>({type:'stepper',key,label,min,max,step,unit});
const TG=(key,label,options,max)=>({type:'tags',key,label,options,max:max||99,allowCustom:true});
const SEL=(key,label,options)=>({type:'select',key,label,options});
const CN=(key,label,options)=>({type:'choicenote',key,label,options});

const DISTRICTS=['中正區','大同區','中山區','松山區','大安區','萬華區','信義區','士林區','北投區','內湖區','南港區','文山區',
  '板橋區','三重區','中和區','永和區','新莊區','新店區','土城區','蘆洲區','樹林區','汐止區','三峽區','淡水區','五股區','泰山區','林口區','其他'];

/* =========================================================
   SCHEMA
========================================================= */
const SECTIONS=[
{id:'s1',title:'① 基本資料',fields:[
  T('nickname','物件暱稱','例：頂溪25K三房'),
  D('viewDate','看房日期'), TM('viewTime','看房時間'),
  C('platform','刊登平台',['591','樂屋','好房','FB','仲介','其他']),
  T('url','物件網址','貼上連結（選填）'),
  T('address','完整地址'),
  SEL('district','行政區',DISTRICTS),
  T('mrt','最近捷運站','輸入或從建議選擇',{list:'mrtStations'}),
  C('mrtDist','距捷運站',['5分鐘內','5-10分鐘','10-15分鐘','15分鐘以上']),
  C('commuteTime','通勤時間（到常去地點）',['10分鐘內','10-20分鐘','20-30分鐘','30分鐘以上']),
  C('busAccess','附近公車',['很方便','需走一段路','不清楚']),
  C('parking','附近機車停車',['好找','普通','困難']),
  M('amenities','附近生活機能',['市場','超商','超市','醫院','餐飲','公園']),
]},
{id:'s2',title:'② 租金與所有費用',fields:[
  N('rent','月租','$'), N('mgmtFee','管理費','$'),
  ST('depositMonths','押金（月數）',0,3,0.5,'個月'),
  C('agentFee','仲介費',['無','半個月','一個月','其他']),
  C('water','水費',['台水帳單','含租','每人固定','每度計費','其他']),
  C('electric','電費',['台電帳單','台電分攤','每度計費','夏季另計','其他']),
  C('gasHave','天然瓦斯',['有','無']),
  C('gasFee','瓦斯費',['台灣天然氣帳單','桶裝瓦斯','無需額外付費','其他']),
  C('internet','網路',['含租','自理','每月固定收費']),
  N('parkingFeeScooter','機車停車費','$'), N('parkingFeeCar','汽車停車費','$'),
  C('trashFee','垃圾處理費',['含管理費','另外收費','自行追垃圾車']),
  T('otherFee','其他費用（選填）'),
]},
{id:'s3',title:'③ 房屋本身',fields:[
  ST('rooms','房',0,6,1,'房'), ST('livingRooms','廳',0,4,1,'廳'),
  ST('bathrooms','衛',0,4,1,'衛'), ST('balconyCount','陽台',0,3,1,'個'),
  N('ping','坪數'), N('pingUsable','實際可使用坪數'),
  C('buildingType','建物類型',['電梯大樓','華廈','公寓','套房','其他']),
  ST('floorAt','所在樓層',0,30,1,'樓'), ST('floorTotal','共幾層',1,40,1,'樓'),
  C('isTopAdd','頂樓加蓋',['是','否','不適用']),
  C('elevator','電梯',['有','無']),
  C('ageRange','屋齡',['5年內','5-10年','10-20年','20-30年','30年以上','不確定']),
  C('exterior','建物外觀',['新','普通','老舊']),
  S('scorePublicClean','公共區域整潔'),
  M('safetyEquip','安全設備（可複選）',['逃生梯','煙霧偵測器','滅火器']),
  C('fireSafety','消防設備狀況',['正常','需確認']),
]},
{id:'s4',title:'④ 採光、通風與居住體感',fields:[
  S('scoreLivingLight','客廳採光'), S('scoreMasterLight','主臥採光'),
  S('scoreSecondLight','次臥採光'), S('scoreVentilation','通風'),
  M('windowsIn','有對外窗的空間（可複選）',['客廳','主臥','次臥','浴室','廚房']),
  C('westSun','西曬',['有','無']),
  C('topHeat','頂樓炎熱疑慮',['有','無','不適用']),
  C('damp','室內潮濕感',['無','輕微','明顯']),
  M('smells','聞到的異味（可複選，沒有請不選）',['霉味','煙味','寵物味','排水溝味','其他']),
]},

const SCORE_KEYS=['scoreLocation','scoreRentValue','scoreLayout','scoreLight','scoreQuiet','scoreCondition','scoreEquip','scorePetFriendly','scoreLandlord','scoreContract','scoreLife','scoreOverall'];

/* =========================================================
   STATE + STORAGE
========================================================= */
const STORAGE_KEY='house_viewing_records_v2';
let state={houses:[],view:'list',editingId:null,search:'',sortBy:'smart',filterStatus:''};
let storageOK=true;

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){const d=JSON.parse(raw); if(Array.isArray(d)) state.houses=d;}
    else{
      const old=localStorage.getItem('house_viewing_records_v1');
      if(old){ const d=JSON.parse(old); if(Array.isArray(d)) state.houses=d; }
    }
  }catch(e){ storageOK=false; }
}
let saveTimer=null;
function saveState(immediate){
  const doSave=()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.houses)); storageOK=true; }
    catch(e){ storageOK=false; }
  };
  if(immediate){ doSave(); return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,250);
}

function uid(){ return 'h'+Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function newHouse(){ return {id:uid(), createdAt:new Date().toISOString(), data:{}}; }

/* =========================================================
   SCORING ENGINE
========================================================= */
function hasAnyScore(house){ return SCORE_KEYS.some(k=>Number(house.data[k])>0); }
function starAvg(house){
  let sum=0,n=0;
  SCORE_KEYS.forEach(k=>{ const v=Number(house.data[k])||0; if(v>0){ sum+=v; n++; } });
  return n?sum/n:0;
}
function redFlagCount(house){ const a=house.data.redFlags; return Array.isArray(a)?a.length:0; }
function photoCount(house){ const a=house.data.photoChecklist; return Array.isArray(a)?a.length:0; }
function monthlyTotal(house){ return (Number(house.data.rent)||0)+(Number(house.data.mgmtFee)||0); }

function finalScore(house){
  if(!hasAnyScore(house)) return null;
  const base=starAvg(house)/5*100;
  const flagPenalty=Math.min(redFlagCount(house)*4,40);
  const gutMap={'放心':5,'普通':0,'有點怪':-8,'不舒服':-15};
  const gutAdj=gutMap[house.data.gutFeeling]||0;
  const petMap={'不行':-15,'需確認':-5};
  const petAdj=petMap[house.data.petAllowed]||0;
  let s=base-flagPenalty+gutAdj+petAdj;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function scoreClass(score){
  if(score===null) return 'none';
  if(score>=80) return 'good';
  if(score>=60) return 'mid';
  return 'bad';
}
function computeRanks(){
  const scored=state.houses.filter(h=>finalScore(h)!==null).slice()
    .sort((a,b)=>finalScore(b)-finalScore(a));
  const map={};
  scored.forEach((h,i)=>{ map[h.id]=i+1; });
  return map;
}
const MEDALS={1:'🥇',2:'🥈',3:'🥉'};

/* =========================================================
   RENDER: LIST VIEW
========================================================= */
function renderList(){
  const el=document.createElement('div');
  const ranks=computeRanks();
  const houses=state.houses.filter(h=>{
    if(!state.search) return true;
    const s=(h.data.nickname||'')+(h.data.address||'')+(h.data.district||'');
    return s.toLowerCase().includes(state.search.toLowerCase());
  });

  if(!storageOK){
    const b=document.createElement('div'); b.className='save-banner';
    b.textContent='⚠️ 這個瀏覽器目前無法自動儲存，請常用選單裡的「匯出備份」保存資料';
    el.appendChild(b);
  }

  const searchWrap=document.createElement('div'); searchWrap.className='searchbar';
  searchWrap.innerHTML=`<span>🔍</span><input type="text" placeholder="搜尋暱稱、地址、行政區…" value="${escapeAttr(state.search)}">`;
  searchWrap.querySelector('input').addEventListener('input',e=>{ state.search=e.target.value; renderApp(); });
  el.appendChild(searchWrap);

  if(houses.length===0){
    const empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML=`<div class="big">🏚️</div>${state.houses.length===0?'還沒有看房紀錄<br>點右下角「＋」新增第一間':'找不到符合的紀錄'}`;
    el.appendChild(empty);
    return el;
  }

  houses.slice().reverse().forEach(h=>{
    const d=h.data;
    const card=document.createElement('div'); card.className='house-card';
    const sc=finalScore(h);
    const flags=redFlagCount(h);
    const rentTxt=d.rent?('$'+Number(monthlyTotal(h)).toLocaleString()+'/月'):'';
    const rank=ranks[h.id];
    const medal=rank&&MEDALS[rank]?MEDALS[rank]+' ':'';
    card.innerHTML=`
      <div class="tag-line">${medal}${escapeHtml(d.nickname||'（未命名物件）')}</div>
      <div class="addr">${escapeHtml(d.address||d.district||'尚未填寫地址')}</div>
      <div class="meta-row">
        ${rentTxt?`<span class="pill">${rentTxt}</span>`:''}
        ${d.ping?`<span class="pill">${escapeHtml(String(d.ping))}坪</span>`:''}
        <span class="score-badge ${scoreClass(sc)}">${sc===null?'尚未評分':'綜合 '+sc+'分'}</span>
        ${d.status?`<span class="pill status">${escapeHtml(d.status)}</span>`:''}
        ${flags>0?`<span class="pill flag">🚩 ${flags}項</span>`:''}
        ${d.decision?`<span class="pill decision">${escapeHtml(d.decision)}</span>`:''}
      </div>`;
    card.addEventListener('click',()=>{ state.editingId=h.id; state.view='edit'; renderApp(); });
    el.appendChild(card);
  });
  return el;
}

/* =========================================================
   RENDER: EDIT VIEW — field renderers
========================================================= */
function fieldValue(house,key){ return house.data[key]; }
function setFieldValue(house,key,val){ house.data[key]=val; saveState(); }

function renderFieldHTML(house,f){
  const val=fieldValue(house,f.key);
  const wrap=document.createElement('div'); wrap.className='field';
  const label=document.createElement('label'); label.textContent=f.label; wrap.appendChild(label);

  if(f.type==='text'||f.type==='date'||f.type==='time'||f.type==='tel'){
    const inp=document.createElement('input'); inp.type=f.type; inp.placeholder=f.placeholder||'';
    if(f.list) inp.setAttribute('list',f.list);
    inp.value=val||''; inp.dataset.key=f.key;
    inp.addEventListener('input',()=>{ setFieldValue(house,f.key,inp.value); });
    wrap.appendChild(inp);

  } else if(f.type==='number'){
    const uw=document.createElement('div'); uw.className='unit-wrap';
    const inp=document.createElement('input'); inp.type='number'; inp.inputMode='decimal';
    inp.value=(val===undefined||val===null)?'':val; inp.dataset.key=f.key;
    inp.addEventListener('input',()=>{ setFieldValue(house,f.key,inp.value===''?'':Number(inp.value)); refreshSummaryBar(house); });
    uw.appendChild(inp);
    if(f.unit){ const u=document.createElement('span'); u.textContent=f.unit; uw.appendChild(u); }
    wrap.appendChild(uw);

  } else if(f.type==='textarea'){
    const ta=document.createElement('textarea'); ta.value=val||''; ta.dataset.key=f.key;
    ta.addEventListener('input',()=>{ setFieldValue(house,f.key,ta.value); });
    wrap.appendChild(ta);

  } else if(f.type==='select'){
    const sel=document.createElement('select');
    const blank=document.createElement('option'); blank.value=''; blank.textContent='請選擇…'; sel.appendChild(blank);
    f.options.forEach(opt=>{ const o=document.createElement('option'); o.value=opt; o.textContent=opt; if(val===opt) o.selected=true; sel.appendChild(o); });
    sel.addEventListener('change',()=>{ setFieldValue(house,f.key,sel.value); toggleOther(); });
    wrap.appendChild(sel);
    const otherWrap=document.createElement('div'); otherWrap.className='other-wrap';
    const otherInp=document.createElement('input'); otherInp.type='text'; otherInp.placeholder='請簡短說明';
    otherInp.value=fieldValue(house,f.key+'Other')||'';
    otherInp.addEventListener('input',()=>{ setFieldValue(house,f.key+'Other',otherInp.value); });
    otherWrap.appendChild(otherInp); wrap.appendChild(otherWrap);
    function toggleOther(){ otherWrap.classList.toggle('show', sel.value==='其他'); }
    toggleOther();

  } else if(f.type==='choice'){
    const row=document.createElement('div'); row.className='chip-row';
    f.options.forEach(opt=>{
      const chip=document.createElement('button'); chip.type='button'; chip.className='chip'+(val===opt?' on':'');
      chip.textContent=opt;
      chip.addEventListener('click',()=>{
        const nv=(val===opt)?'':opt;
        setFieldValue(house,f.key,nv);
        row.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
        if(nv) chip.classList.add('on');
        toggleOther();
        refreshSummaryBar(house);
      });
      row.appendChild(chip);
    });
    wrap.appendChild(row);
    let otherWrap=null,otherInp=null;
    if(f.options.includes('其他')){
      otherWrap=document.createElement('div'); otherWrap.className='other-wrap';
      otherInp=document.createElement('input'); otherInp.type='text'; otherInp.placeholder='請簡短說明「其他」的內容';
      otherInp.value=fieldValue(house,f.key+'Other')||'';
      otherInp.addEventListener('input',()=>{ setFieldValue(house,f.key+'Other',otherInp.value); });
      otherWrap.appendChild(otherInp); wrap.appendChild(otherWrap);
    }
    function toggleOther(){ if(otherWrap) otherWrap.classList.toggle('show', fieldValue(house,f.key)==='其他'); }
    toggleOther();

  } else if(f.type==='multiselect'){
    const row=document.createElement('div'); row.className='chip-row';
    const arr=Array.isArray(val)?val.slice():[];
    f.options.forEach(opt=>{
      const chip=document.createElement('button'); chip.type='button';
      chip.className='chip'+(arr.includes(opt)?' on multi':''); chip.textContent=opt;
      chip.addEventListener('click',()=>{
        const cur=Array.isArray(fieldValue(house,f.key))?fieldValue(house,f.key).slice():[];
        const i=cur.indexOf(opt);
        if(i>=0) cur.splice(i,1); else cur.push(opt);
        setFieldValue(house,f.key,cur);
        chip.classList.toggle('on'); chip.classList.toggle('multi');
        toggleOther();
      });
      row.appendChild(chip);
    });
    wrap.appendChild(row);
    let otherWrap=null,otherInp=null;
    if(f.options.includes('其他')){
      otherWrap=document.createElement('div'); otherWrap.className='other-wrap';
      otherInp=document.createElement('input'); otherInp.type='text'; otherInp.placeholder='請簡短說明「其他」的內容';
      otherInp.value=fieldValue(house,f.key+'Other')||'';
      otherInp.addEventListener('input',()=>{ setFieldValue(house,f.key+'Other',otherInp.value); });
      otherWrap.appendChild(otherInp); wrap.appendChild(otherWrap);
    }
    function toggleOther(){ if(otherWrap){ const cur=Array.isArray(fieldValue(house,f.key))?fieldValue(house,f.key):[]; otherWrap.classList.toggle('show',cur.includes('其他')); } }
    toggleOther();

  } else if(f.type==='star'){
    const row=document.createElement('div'); row.className='stars';
    const cur=Number(val)||0;
    for(let i=1;i<=5;i++){
      const s=document.createElement('span'); s.className='star'+(i<=cur?' on':''); s.textContent='★';
      s.addEventListener('click',()=>{
        const now=Number(fieldValue(house,f.key))||0;
        const nv=(now===i)?0:i;
        setFieldValue(house,f.key,nv);
        row.querySelectorAll('.star').forEach((st,idx)=>st.classList.toggle('on',idx<nv));
        refreshSummaryBar(house);
      });
      row.appendChild(s);
    }
    wrap.appendChild(row);

  } else if(f.type==='stepper'){
    const row=document.createElement('div'); row.className='stepper';
    let cur=(val===undefined||val===null||val==='')?f.min:Number(val);
    const minus=document.createElement('button'); minus.type='button'; minus.textContent='－';
    const plus=document.createElement('button'); plus.type='button'; plus.textContent='＋';
    const valSpan=document.createElement('span'); valSpan.className='val';
    function fmt(v){ return (v%1!==0?v.toFixed(1):v)+(f.unit?f.unit:''); }
    valSpan.textContent=fmt(cur);
    minus.addEventListener('click',()=>{ cur=Math.max(f.min,+(cur-f.step).toFixed(2)); valSpan.textContent=fmt(cur); setFieldValue(house,f.key,cur); if(f.key==='floorAt'||f.key==='floorTotal') refreshTopBadge(); });
    plus.addEventListener('click',()=>{ cur=Math.min(f.max,+(cur+f.step).toFixed(2)); valSpan.textContent=fmt(cur); setFieldValue(house,f.key,cur); if(f.key==='floorAt'||f.key==='floorTotal') refreshTopBadge(); });
    row.appendChild(minus); row.appendChild(valSpan); row.appendChild(plus);
    wrap.appendChild(row);
    if(val===undefined) setFieldValue(house,f.key,cur);
    if(f.key==='floorTotal'){
      const badge=document.createElement('div'); badge.className='top-badge'; badge.id='topFloorBadge';
      wrap.appendChild(badge);
    }

  } else if(f.type==='tags'){
    const row=document.createElement('div'); row.className='chip-row';
    const arr=Array.isArray(val)?val.slice():[];
    const counter=document.createElement('div'); counter.className='tags-counter';
    function updateCounter(){ const cur=Array.isArray(fieldValue(house,f.key))?fieldValue(house,f.key):[]; counter.textContent=`已選 ${cur.length} 項`; }
    f.options.forEach(opt=>{
      const chip=document.createElement('button'); chip.type='button';
      chip.className='chip'+(arr.includes(opt)?' on multi':''); chip.textContent=opt;
      chip.addEventListener('click',()=>{
        const cur=Array.isArray(fieldValue(house,f.key))?fieldValue(house,f.key).slice():[];
        const i=cur.indexOf(opt);
        if(i>=0) cur.splice(i,1); else cur.push(opt);
        setFieldValue(house,f.key,cur);
        chip.classList.toggle('on'); chip.classList.toggle('multi');
        updateCounter();
      });
      row.appendChild(chip);
    });
    if(f.allowCustom){
      const addChip=document.createElement('button'); addChip.type='button'; addChip.className='chip dashed'; addChip.textContent='＋自訂';
      addChip.addEventListener('click',()=>{ customWrap.classList.toggle('show'); if(customWrap.classList.contains('show')) customInput.focus(); });
      row.appendChild(addChip);
    }
    wrap.appendChild(row);
    wrap.appendChild(counter); updateCounter();
    let customWrap,customInput;
    if(f.allowCustom){
      customWrap=document.createElement('div'); customWrap.className='tags-custom-wrap';
      customInput=document.createElement('input'); customInput.type='text'; customInput.placeholder='輸入其他項目…';
      const okBtn=document.createElement('button'); okBtn.type='button'; okBtn.textContent='新增';
      okBtn.addEventListener('click',()=>{
        const v=customInput.value.trim(); if(!v) return;
        const cur=Array.isArray(fieldValue(house,f.key))?fieldValue(house,f.key).slice():[];
        if(!cur.includes(v)){
          cur.push(v); setFieldValue(house,f.key,cur);
          const chip=document.createElement('button'); chip.type='button'; chip.className='chip on multi'; chip.textContent=v;
          chip.addEventListener('click',()=>{
            const c2=fieldValue(house,f.key).slice(); const i2=c2.indexOf(v); if(i2>=0) c2.splice(i2,1);
            setFieldValue(house,f.key,c2); chip.remove(); updateCounter();
          });
          row.insertBefore(chip,row.lastElementChild);
          updateCounter();
        }
        customInput.value=''; customWrap.classList.remove('show');
      });
      customWrap.appendChild(customInput); customWrap.appendChild(okBtn);
      wrap.appendChild(customWrap);
    }

  } else if(f.type==='choicenote'){
    const row=document.createElement('div'); row.className='chip-row';
    const cur=val;
    f.options.forEach(opt=>{
      const chip=document.createElement('button'); chip.type='button'; chip.className='chip'+(cur===opt?' on':'');
      chip.textContent=opt;
      chip.addEventListener('click',()=>{
        const nv=(fieldValue(house,f.key)===opt)?'':opt;
        setFieldValue(house,f.key,nv);
        row.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
        if(nv) chip.classList.add('on');
      });
      row.appendChild(chip);
    });
    wrap.appendChild(row);
    const noteVal=fieldValue(house,f.key+'Note');
    const toggleBtn=document.createElement('button'); toggleBtn.type='button'; toggleBtn.className='note-toggle';
    toggleBtn.textContent=noteVal?'✎ 編輯備註':'＋ 加註備註（選填）';
    const noteWrap=document.createElement('div'); noteWrap.className='note-wrap'+(noteVal?' show':'');
    const noteInp=document.createElement('input'); noteInp.type='text'; noteInp.placeholder='補充說明（選填）';
    noteInp.value=noteVal||'';
    noteInp.addEventListener('input',()=>{ setFieldValue(house,f.key+'Note',noteInp.value); });
    noteWrap.appendChild(noteInp);
    toggleBtn.addEventListener('click',()=>{ noteWrap.classList.toggle('show'); if(noteWrap.classList.contains('show')) noteInp.focus(); });
    wrap.appendChild(toggleBtn); wrap.appendChild(noteWrap);

  } else if(f.type==='checklist'){
    wrap.removeChild(label);
    const lbl2=document.createElement('label');
    const arr=Array.isArray(val)?val:[];
    lbl2.textContent=f.label+`（已勾 ${arr.length}/${f.items.length}）`;
    wrap.appendChild(lbl2);
    const list=document.createElement('div');
    f.items.forEach(item=>{
      const row=document.createElement('div');
      row.className='checklist-item'+(f.flag?' flagitem':'')+(arr.includes(item)?' on':'');
      row.innerHTML=`<span class="box">✓</span><span>${escapeHtml(item)}</span>`;
      row.addEventListener('click',()=>{
        const cur=Array.isArray(fieldValue(house,f.key))?fieldValue(house,f.key).slice():[];
        const i=cur.indexOf(item);
        if(i>=0) cur.splice(i,1); else cur.push(item);
        setFieldValue(house,f.key,cur);
        row.classList.toggle('on');
        lbl2.textContent=f.label+`（已勾 ${cur.length}/${f.items.length}）`;
        refreshSummaryBar(house);
      });
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }
  return wrap;
}

function refreshTopBadge(){
  const badge=document.getElementById('topFloorBadge');
  if(!badge) return;
  const house=state.houses.find(h=>h.id===state.editingId);
  if(!house) return;
  const at=Number(house.data.floorAt)||0, tot=Number(house.data.floorTotal)||0;
  badge.textContent=(at>0&&tot>0&&at===tot)?'🔝 這是頂樓':'';
}

function refreshSummaryBar(house){
  const bar=document.getElementById('summaryBar');
  if(!bar) return;
  bar.querySelector('[data-sum="rent"]').textContent = house.data.rent?('$'+monthlyTotal(house).toLocaleString()):'—';
  const sc=finalScore(house);
  bar.querySelector('[data-sum="score"]').textContent = sc===null?'—':(sc+'分');
  bar.querySelector('[data-sum="flag"]').textContent = redFlagCount(house);
}

function renderEdit(){
  const house=state.houses.find(h=>h.id===state.editingId);
  const el=document.createElement('div');
  if(!house){ el.textContent='找不到這筆紀錄'; return el; }

  const hd=document.createElement('div'); hd.className='edit-header';
  hd.innerHTML=`<button class="back">←</button>
    <input class="id-input" placeholder="一句話辨識，例：頂溪｜25K｜27坪｜3F｜屋主｜可貓" value="${escapeAttr(house.data.nickname||'')}">
    <button class="del-btn">刪除</button>`;
  hd.querySelector('.back').addEventListener('click',()=>{ state.view='list'; state.editingId=null; renderApp(); });
  hd.querySelector('.id-input').addEventListener('input',e=>{ setFieldValue(house,'nickname',e.target.value); });
  hd.querySelector('.del-btn').addEventListener('click',()=>{
    if(confirm('確定要刪除這筆看房紀錄嗎？此動作無法復原。')){
      state.houses=state.houses.filter(h=>h.id!==house.id);
      saveState(true); state.view='list'; state.editingId=null; renderApp();
      showToast('已刪除');
    }
  });
  el.appendChild(hd);

  const sc=finalScore(house);
  const bar=document.createElement('div'); bar.className='summary-bar'; bar.id='summaryBar';
  bar.innerHTML=`
    <div class="summary-tile"><div class="val" data-sum="rent">${house.data.rent?('$'+monthlyTotal(house).toLocaleString()):'—'}</div><div class="lbl">每月固定支出</div></div>
    <div class="summary-tile"><div class="val" data-sum="score">${sc===null?'—':(sc+'分')}</div><div class="lbl">系統綜合評分</div></div>
    <div class="summary-tile"><div class="val" data-sum="flag">${redFlagCount(house)}</div><div class="lbl">紅旗警訊</div></div>`;
  el.appendChild(bar);

  SECTIONS.forEach((sec,idx)=>{
    const det=document.createElement('details'); det.className='section';
    if(idx===0) det.open=true;
    const sum=document.createElement('summary');
    sum.innerHTML=`<span>${sec.title}</span><span class="chev">▶</span>`;
    det.appendChild(sum);
    const body=document.createElement('div'); body.className='section-body';
    sec.fields.forEach(f=>{ body.appendChild(renderFieldHTML(house,f)); });
    det.appendChild(body);
    el.appendChild(det);
  });

  setTimeout(refreshTopBadge,0);
  return el;
}

/* =========================================================
   RENDER: COMPARE VIEW（含排行榜）
========================================================= */
function buildTags(house,rank,cheapest){
  const tags=[];
  if(redFlagCount(house)===0) tags.push('零紅旗');
  if(house.data.gutFeeling==='放心') tags.push('房東放心');
  if(house.id===cheapest) tags.push('租金最低');
  if(house.data.petAllowed==='明確可以') tags.push('明確可貓');
  return tags.slice(0,2);
}

function renderCompare(){
  const el=document.createElement('div');
  const scoredHouses=state.houses.filter(h=>finalScore(h)!==null);

  if(scoredHouses.length>0){
    const sorted=scoredHouses.slice().sort((a,b)=>finalScore(b)-finalScore(a));
    const withRent=scoredHouses.filter(h=>h.data.rent);
    const cheapest=withRent.length?withRent.reduce((a,b)=>monthlyTotal(a)<=monthlyTotal(b)?a:b).id:null;
    const top=sorted.slice(0,3);
    const card=document.createElement('div'); card.className='top-pick-card';
    card.innerHTML=`<h3>🏆 目前排行榜（依系統綜合評分）</h3>`;
    top.forEach((h,i)=>{
      const row=document.createElement('div'); row.className='top-pick-row';
      const tags=buildTags(h,i+1,cheapest);
      row.innerHTML=`<span class="medal">${MEDALS[i+1]||''}</span>
        <div class="info"><div class="t1">${escapeHtml(h.data.nickname||'（未命名）')}</div>
        <div class="tags">${tags.map(t=>`<span>${t}</span>`).join('')}</div></div>
        <div class="n">${finalScore(h)}</div>`;
      row.addEventListener('click',()=>{ state.editingId=h.id; state.view='edit'; renderApp(); });
      card.appendChild(row);
    });
    el.appendChild(card);
    const explain=document.createElement('div'); explain.className='score-explain';
    explain.textContent='綜合評分＝12項星等平均換算100分，再依紅旗數量、直覺感受、寵物條件加減分';
    el.appendChild(explain);
  }

  const ctrl=document.createElement('div'); ctrl.className='compare-controls';
  ctrl.innerHTML=`
    <select id="sortSel">
      <option value="smart">依系統綜合評分（高→低）</option>
      <option value="rent">依租金排序（低→高）</option>
      <option value="flag">依紅旗數排序（低→高）</option>
      <option value="date">依看房日期（新→舊）</option>
    </select>
    <select id="statusSel">
      <option value="">全部狀態</option>
      <option value="未看房">未看房</option><option value="已預約">已預約</option>
      <option value="已看房">已看房</option><option value="考慮中">考慮中</option>
      <option value="第二順位">第二順位</option><option value="準備簽約">準備簽約</option>
      <option value="淘汰">淘汰</option>
    </select>`;
  ctrl.querySelector('#sortSel').value=state.sortBy;
  ctrl.querySelector('#statusSel').value=state.filterStatus;
  ctrl.querySelector('#sortSel').addEventListener('change',e=>{ state.sortBy=e.target.value; renderApp(); });
  ctrl.querySelector('#statusSel').addEventListener('change',e=>{ state.filterStatus=e.target.value; renderApp(); });
  el.appendChild(ctrl);

  let houses=state.houses.slice();
  if(state.filterStatus) houses=houses.filter(h=>h.data.status===state.filterStatus);

  if(houses.length===0){
    const empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML=`<div class="big">📊</div>還沒有可以比較的紀錄`;
    el.appendChild(empty); return el;
  }

  houses.sort((a,b)=>{
    if(state.sortBy==='smart'){ const sa=finalScore(a),sb=finalScore(b); if(sa===null&&sb===null) return 0; if(sa===null) return 1; if(sb===null) return -1; return sb-sa; }
    if(state.sortBy==='rent') return (monthlyTotal(a)||1e12)-(monthlyTotal(b)||1e12);
    if(state.sortBy==='flag') return redFlagCount(a)-redFlagCount(b);
    if(state.sortBy==='date') return (b.data.viewDate||'').localeCompare(a.data.viewDate||'');
    return 0;
  });

  houses.forEach((h,i)=>{
    const row=document.createElement('div'); row.className='compare-row';
    const sc=finalScore(h);
    row.innerHTML=`
      <div class="rank">${i+1}</div>
      <div class="info">
        <div class="t1">${escapeHtml(h.data.nickname||'（未命名）')}</div>
        <div class="t2">${h.data.rent?('$'+monthlyTotal(h).toLocaleString()+'/月　'):''}${h.data.status||''}${redFlagCount(h)>0?'　🚩'+redFlagCount(h):''}</div>
      </div>
      <span class="score-badge ${scoreClass(sc)}">${sc===null?'尚未評分':sc+'分'}</span>`;
    row.addEventListener('click',()=>{ state.editingId=h.id; state.view='edit'; renderApp(); });
    el.appendChild(row);
  });
  return el;
}

    <div class="menu-item" id="mClear"><span class="ic">🗑️</span><div><div style="color:var(--red)">清空全部紀錄</div></div></div>`;
  sheet.querySelector('.modal-close').addEventListener('click',()=>bd.remove());
  sheet.querySelector('#mExport').addEventListener('click',()=>{ exportJSON(); bd.remove(); });
  sheet.querySelector('#mImport').addEventListener('click',()=>{ document.getElementById('fileImport').click(); bd.remove(); });
  sheet.querySelector('#mCsv').addEventListener('click',()=>{ exportCSV(); bd.remove(); });
  sheet.querySelector('#mHome').addEventListener('click',()=>{ showToast('請用瀏覽器的「分享」或選單功能加入主畫面'); bd.remove(); });
  sheet.querySelector('#mClear').addEventListener('click',()=>{
    if(confirm('確定要清空所有看房紀錄嗎？建議先匯出備份！')){
      state.houses=[]; saveState(true); bd.remove(); renderApp(); showToast('已清空');
    }
  });
  bd.appendChild(sheet);
  document.body.appendChild(bd);
}

function exportJSON(){
  const payload={exportedAt:new Date().toISOString(), houses:state.houses};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const dateStr=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob); a.download=`看房紀錄備份_${dateStr}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('已匯出備份檔');
}

function csvEscape(v){
  if(v===undefined||v===null) return '';
  const s=Array.isArray(v)?v.join('；'):String(v);
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCSV(){
  const cols=[['nickname','一句話辨識'],['address','完整地址'],['district','行政區'],['viewDate','看房日期'],
    ['rent','月租'],['mgmtFee','管理費'],['ping','坪數'],['rooms','房'],['livingRooms','廳'],['bathrooms','衛'],
    ['floorAt','所在樓層'],['floorTotal','共幾層'],['elevator','電梯'],
    ['furnishStatus','出租狀態'],['acLivingType','客廳冷氣類型'],['petAllowed','可養貓'],
    ['status','目前狀態'],['decision','我的決定']];
  const header=cols.map(c=>csvEscape(c[1])).concat(['系統綜合評分','紅旗數']).join(',');
  const rows=state.houses.map(h=>{
    const vals=cols.map(c=>csvEscape(h.data[c[0]]));
    const sc=finalScore(h);
    vals.push(sc===null?'':sc); vals.push(redFlagCount(h));
    return vals.join(',');
  });
  const csv='﻿'+[header,...rows].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='看房比較.csv';
  document.body.appendChild(a); a.click(); a.remove();
  showToast('已匯出 CSV');
}

document.getElementById('fileImport').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=Array.isArray(parsed)?parsed:parsed.houses;
      if(!Array.isArray(incoming)) throw new Error('格式錯誤');
      const existingIds=new Set(state.houses.map(h=>h.id));
      let added=0;
      incoming.forEach(h=>{ if(h&&h.id&&!existingIds.has(h.id)){ state.houses.push(h); added++; } });
      saveState(true); renderApp();
      showToast(`已匯入 ${added} 筆新紀錄`);
    }catch(err){ showToast('匯入失敗，檔案格式不正確'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

/* =========================================================
   UTIL
========================================================= */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* =========================================================
   APP SHELL
========================================================= */
function renderApp(){
  const main=document.getElementById('main');
  main.innerHTML='';
  let content;
  if(state.view==='list') content=renderList();
  else if(state.view==='edit') content=renderEdit();
  else if(state.view==='compare') content=renderCompare();
  else content=renderHelp();
  main.appendChild(content);
  main.scrollTop=0;

  document.querySelectorAll('.navbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===state.view || (state.view==='edit'&&b.dataset.view==='list'));
  });
  document.getElementById('fabAdd').style.display=(state.view==='edit')?'none':'flex';
}

document.querySelectorAll('.navbtn').forEach(b=>{
  b.addEventListener('click',()=>{ state.view=b.dataset.view; state.editingId=null; renderApp(); });
});
document.getElementById('fabAdd').addEventListener('click',()=>{
  const h=newHouse(); state.houses.push(h); saveState(true);
  state.editingId=h.id; state.view='edit'; renderApp();
});
document.getElementById('btnMenu').addEventListener('click',openMenu);

loadState();
renderApp();

/* 註冊 Service Worker：沒網路時也能開啟 App */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
